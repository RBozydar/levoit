# Rounded 7-segment digital style for `display_clock`. Include just this file:
#
#   packages:
#     clock: !include display_clock/display_clock_digital.yaml
#
# You still provide:
#   - a time source (default id: sntp_time - override via substitutions below)
#   - the display, and the draw call in its lambda / an interval:
#       display backend:  id(dc).draw(it);
#       LVGL canvas:      id(dc).draw_to_canvas(id(dc_canvas));
#
# Override the defaults from your main config, e.g.:
#   substitutions:
#     clock_time_id: my_time

substitutions:
  clock_id: dc
  clock_time_id: sntp_time

color:
  - id: dg_on        # lit segments
    red: 100%
    green: 100%
    blue: 100%
  - id: dg_off       # unlit "ghost" segments
    red: 12%
    green: 12%
    blue: 14%
  - id: dg_bg
    red: 0%
    green: 0%
    blue: 0%

display_clock:
  id: ${clock_id}
  time_id: ${clock_time_id}
  foreground: dg_on
  background: dg_bg
  digital:
    seconds: true            # HH:MM:SS
    blink: true              # colon blinks (dims to off_color)
    # blank_leading_zero: false
    off_color: dg_off        # the "ghost 8"
