# Minimal LVGL sanity check - no display_clock at all, just a static label.
# Use this to isolate whether "noise on screen" is a display_clock/canvas bug
# or a base display + LVGL setup issue.
# Compile:  esphome compile components/display_clock/test_lvgl_label.yaml

esphome:
  name: test-lvgl-label

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
wifi:
  ssid: !secret wifi_ssid
  password: "12345670"
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
display:
  - platform: mipi_spi
    id: my_display
    model: "ST7735"
    reset_pin: GPIO04
    cs_pin: GPIO16
    dc_pin: GPIO17
    rotation: 0
    dimensions:
      width: 128
      height: 160
    update_interval: 33ms
lvgl:
  displays: [my_display]
  rotation: 90
  bg_color: 0x000000
  widgets:
    - label:
        id: hello_label
        text: "Hello LVGL"
        align: CENTER
        text_color: 0xFFFFFF
