# ClockClock-24 style for `display_clock` - a digital clock made of 24 mini
# analogue clocks. Include just this file to get the whole clock:
#
#   packages:
#     clock: !include display_clock/display_clock_clockclock24.yaml
#
# You still provide:
#   - a time source (default id: sntp_time - override via substitutions below)
#   - the display, and the draw call in its lambda / an interval:
#       display backend:  id(dc).draw(it);
#       LVGL canvas:      id(dc).draw_to_canvas(id(dc_canvas));
#   - (optional) the boot-phase actions: display_clock.rotate_left / .show_time
#
# Override the defaults from your main config, e.g.:
#   substitutions:
#     clock_time_id: my_time

substitutions:
  clock_id: dc
  clock_time_id: sntp_time

color:
  - id: cc_hands
    red: 100%
    green: 100%
    blue: 100%
  - id: cc_bg
    red: 0%
    green: 0%
    blue: 0%
  - id: cc_faces       # unlit "ghost" segments
    red: 12%
    green: 12%
    blue: 14%
display_clock:
  id: ${clock_id}
  time_id: ${clock_time_id}
  foreground: cc_hands       # white hands
  background: cc_bg          # black behind
  # anti_alias: true         # smooth diagonals on colour/grayscale panels
  clockclock24:
    movement: long           # opposite | clockwise | counter | long
    mode: rotate_left        # spin until the time syncs
    transition_length: 2s
    # mode_speed: 1.0
    spacing: 0.0             # gap between HH and MM, in clock-widths
    show_face: true
    face_color: cc_faces     # each clock face   (needs show_face)
    border_color: cc_faces   # face border (needs show_face)
